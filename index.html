<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飲酒量記録カレンダー</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 500px; width: 100%; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    h2 { margin-top: 0; font-size: 1.2rem; text-align: center; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .day-name { font-weight: bold; font-size: 0.8rem; color: #666; padding: 4px 0; }
    .day-cell {
      aspect-ratio: 1;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      background: #fff;
    }
    .day-cell.active { border-color: var(--primary); background-color: #eaf2ff; }
    .day-cell.has-data { background-color: #fff4e5; }
    .day-num { font-size: 0.8rem; font-weight: bold; }
    .day-total { font-size: 0.65rem; color: #d9534f; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .btn {
      flex: 1 1 calc(33.333% - 8px);
      padding: 10px 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f9f9f9;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }
    .btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
    .amount-grid .btn { flex: 1 1 calc(25% - 8px); }
    .action-btn {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .action-btn:disabled { background: #ccc; }
    .summary-text { font-size: 1.1rem; text-align: center; font-weight: bold; margin: 8px 0; }
    #loading { text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div id="loading">スプレッドシートからデータを取得中...</div>

  <div class="card">
    <div class="calendar-header">
      <button id="prev-month" class="btn">＜</button>
      <h2 id="month-title" style="margin:0;"></h2>
      <button id="next-month" class="btn">＞</button>
    </div>
    <div class="summary-text" id="monthly-total">今月の合計: 0 ml</div>
    <div class="calendar-grid" id="calendar"></div>
  </div>

  <div class="card" id="input-card">
    <h2 id="selected-date-text">日付を選択してください</h2>
    
    <label style="font-size:0.85rem; font-weight:bold;">1. お酒の種類</label>
    <div class="btn-group" id="type-selector">
      <button class="btn" data-value="ビール">ビール</button>
      <button class="btn" data-value="日本酒">日本酒</button>
      <button class="btn" data-value="サワー">サワー</button>
      <button class="btn" data-value="焼酎">焼酎</button>
      <button class="btn" data-value="その他">その他</button>
    </div>

    <label style="font-size:0.85rem; font-weight:bold;">2. 量 (ml)</label>
    <div class="btn-group amount-grid" id="amount-selector">
      <button class="btn" data-value="40">40</button>
      <button class="btn" data-value="60">60</button>
      <button class="btn" data-value="90">90</button>
      <button class="btn" data-value="120">120</button>
      <button class="btn" data-value="150">150</button>
      <button class="btn" data-value="180">180</button>
      <button class="btn" data-value="350">350</button>
      <button class="btn" data-value="500">500</button>
    </div>

    <button class="action-btn" id="add-record-btn">追加する</button>

    <div style="margin-top: 16px;">
      <div style="font-weight:bold; font-size:0.9rem;" id="daily-total-text">本日の合計: 0 ml</div>
      <ul id="record-list" style="padding-left:20px; font-size:0.85rem; color:#555;"></ul>
    </div>
  </div>
</div>

<script>
  // ★ここにGASで取得したWebアプリURLを貼り付けてください★
  const GAS_WEB_APP_URL = "ここにデプロイしたWebアプリURLを貼る";

  let currentDate = new Date();
  let selectedDateStr = formatDate(currentDate);
  let selectedType = null;
  let selectedAmount = null;
  let db = {};

  function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  async function loadDataFromSpreadsheet() {
    const loadingEl = document.getElementById('loading');
    loadingEl.textContent = "スプレッドシートからデータを取得中...";
    try {
      const res = await fetch(GAS_WEB_APP_URL);
      db = await res.json();
      loadingEl.textContent = "同期完了";
      setTimeout(() => loadingEl.textContent = "", 2000);
    } catch (err) {
      console.error(err);
      loadingEl.textContent = "データの読み込みに失敗しました";
    }
    renderCalendar();
    updateDailyDetails();
  }

  async function saveDataToSpreadsheet(dateStr, type, amount) {
    const loadingEl = document.getElementById('loading');
    const addBtn = document.getElementById('add-record-btn');
    loadingEl.textContent = "スプレッドシートに保存中...";
    addBtn.disabled = true;

    try {
      await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: dateStr, type: type, amount: amount })
      });

      if (!db[dateStr]) db[dateStr] = [];
      db[dateStr].push({ type: type, amount: amount });

      loadingEl.textContent = "保存完了";
      setTimeout(() => loadingEl.textContent = "", 2000);
    } catch (err) {
      console.error(err);
      alert("保存に失敗しました");
    } finally {
      addBtn.disabled = false;
      renderCalendar();
      updateDailyDetails();
    }
  }

  function init() {
    selectDate(selectedDateStr);
    setupEvents();
    loadDataFromSpreadsheet();
  }

  function setupGroupSelector(containerId, onSelect) {
    const container = document.getElementById(containerId);
    container.addEventListener('click', (e) => {
      if (e.target.classList.contains('btn')) {
        Array.from(container.children).forEach(btn => btn.classList.remove('selected'));
        e.target.classList.add('selected');
        onSelect(e.target.dataset.value);
      }
    });
  }

  function setupEvents() {
    setupGroupSelector('type-selector', val => selectedType = val);
    setupGroupSelector('amount-selector', val => selectedAmount = Number(val));

    document.getElementById('add-record-btn').addEventListener('click', () => {
      if (!selectedType || !selectedAmount) {
        alert('お酒の種類と量の両方を選択してください');
        return;
      }
      saveDataToSpreadsheet(selectedDateStr, selectedType, selectedAmount);
    });

    document.getElementById('prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
  }

  function selectDate(dateStr) {
    selectedDateStr = dateStr;
    document.getElementById('selected-date-text').textContent = `${dateStr} の記録`;
    renderCalendar();
    updateDailyDetails();
  }

  function updateDailyDetails() {
    const listEl = document.getElementById('record-list');
    listEl.innerHTML = '';
    const records = db[selectedDateStr] || [];
    let total = 0;

    records.forEach((r) => {
      total += Number(r.amount);
      const li = document.createElement('li');
      li.textContent = `${r.type}: ${r.amount}ml`;
      listEl.appendChild(li);
    });

    document.getElementById('daily-total-text').textContent = `本日の合計: ${total} ml`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    
    document.getElementById('month-title').textContent = `${year}年 ${month + 1}月`;

    const calEl = document.getElementById('calendar');
    calEl.innerHTML = '';

    ['日','月','火','水','木','金','土'].forEach(d => {
      const div = document.createElement('div');
      div.className = 'day-name';
      div.textContent = d;
      calEl.appendChild(div);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    let monthTotal = 0;

    for (let i = 0; i < firstDay; i++) {
      calEl.appendChild(document.createElement('div'));
    }

    for (let d = 1; d <= lastDate; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';
      
      if (dateStr === selectedDateStr) dayCell.classList.add('active');

      const records = db[dateStr] || [];
      const dayTotal = records.reduce((sum, r) => sum + Number(r.amount), 0);
      monthTotal += dayTotal;

      if (dayTotal > 0) dayCell.classList.add('has-data');

      dayCell.innerHTML = `
        <span class="day-num">${d}</span>
        <span class="day-total">${dayTotal > 0 ? dayTotal + 'ml' : ''}</span>
      `;

      dayCell.addEventListener('click', () => selectDate(dateStr));
      calEl.appendChild(dayCell);
    }

    document.getElementById('monthly-total').textContent = `今月の合計: ${monthTotal} ml`;
  }

  init();
</script>
</body>
</html>
